version: '3.8'

services:
  # Database PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: konikph_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-konikph_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-konikph_secure_pass123}
      POSTGRES_DB: ${POSTGRES_DB:-konikph_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432" # Port 5435 agar tidak bentrok dengan database lain di VPS
    networks:
      - konikph_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-konikph_admin} -d ${POSTGRES_DB:-konikph_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplikasi Next.js (KONI Kepahiang)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: konikph_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-konikph_admin}:${POSTGRES_PASSWORD:-konikph_secure_pass123}@db:5432/${POSTGRES_DB:-konikph_db}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-konikph_admin}:${POSTGRES_PASSWORD:-konikph_secure_pass123}@db:5432/${POSTGRES_DB:-konikph_db}?schema=public
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://koni-kph.site}
      ADMIN_SECRET: ${ADMIN_SECRET:-konikph_super_secret_change_me_in_production_2026}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-konikph2026}
      NEXT_PUBLIC_CARTO_API_KEY: ${NEXT_PUBLIC_CARTO_API_KEY:-cb1_33fp_1_49a64373e8a67929f8e566ca}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-KONI Kepahiang Official <no-reply@konikph.site>}
      PORT: 3000
    ports:
      - "127.0.0.1:3303:3000"
    volumes:
      - ./public/uploads:/app/public/uploads
    networks:
      - konikph_network

volumes:
  postgres_data:
    name: konikph_postgres_data

networks:
  konikph_network:
    name: konikph_network
