server {
    listen 80;
    server_name koni-kph.site www.koni-kph.site konikph.site www.konikph.site;
    client_max_body_size 50M;

    # Direct static file serving for user uploads (Fix 404 in Next.js Standalone Docker mode)
    location /uploads/ {
        alias /var/www/konikph.site/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://127.0.0.1:3303;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
